<!doctype html>
<html><head><meta charset="utf-8"><title>frame host</title></head>
<body>
<script>
  function embed(src) {
    var f = document.createElement("iframe");
    // Completion is the frame's own word, after its last bridge attempt, not the load event.
    window.addEventListener("message", function (event) {
      if (event.source === f.contentWindow && event.data === "frame-done") {
        AdmoaiBridge.postMessage("frame-loaded");
      }
    });
    f.src = src;
    document.body.appendChild(f);
  }
  var mode = new URLSearchParams(location.hash.slice(1)).get("frame");
  embed(mode === "same"
    ? "/assets/interactive/frame.html"
    : "https://other.appassets.example/assets/interactive/frame.html");
</script>
</body></html>
