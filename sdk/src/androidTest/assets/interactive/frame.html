<!doctype html>
<html><head><meta charset="utf-8"><title>frame</title></head>
<body>
<script>
  function tryPost(label) {
    try { AdmoaiBridge.postMessage(label); } catch (e) { /* the object does not exist here */ }
  }
  tryPost("from-frame");
  setTimeout(function () {
    tryPost("from-frame-late");
    // Tell the parent page (a DOM message, not the bridge) that the last bridge attempt was made.
    parent.postMessage("frame-done", "*");
  }, 300);
</script>
</body></html>
