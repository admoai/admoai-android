# CodeQL (Java/Kotlin) on every PR, on main, and weekly — the weekly run picks up new
# queries against unchanged code. Advanced setup (this file) rather than the Security-tab
# default setup so the build is reviewed and versioned: Kotlin needs a real compile, and
# :sdk:assembleRelease is what integrators consume.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # --no-build-cache / --rerun-tasks: CodeQL only sees what is actually compiled.
      - name: Build :sdk (release)
        run: ./gradlew :sdk:assembleRelease --no-build-cache --rerun-tasks --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
