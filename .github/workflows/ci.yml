# Runs on every PR and on pushes to main: ktlint + Android lint, unit tests, and
# a build of the :sdk library. Mirrors the JDK/Gradle
# setup used by release-please.yml so local, CI, and release builds stay aligned.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref supersedes in-flight runs, saving runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that changes only documentation skips the `build` job below.
  # A job skipped by its `if:` reports as skipped, which a ruleset reads as passing, so the
  # required check names never wait. Only pull requests are planned: on push to main and
  # workflow_dispatch this job is skipped, and a skipped planner means every job runs. The
  # Scenario manifest job and the CodeQL workflow are never filtered. The file list comes from the
  # compare API, which lists at most 300 files; at the cap, on an empty or unreadable list,
  # or when this job fails, every job runs.
  changes:
    name: Plan the CI jobs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
      - name: Does the change touch anything but documentation?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_all() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "$1: every job runs"; exit 0; }
          # A rename lists its old path too, so moving code into a docs path still runs the jobs.
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" \
            --jq '{n: (.files|length), f: [.files[] | .filename, (.previous_filename // empty)]}')" \
            || run_all "compare API failed"
          n="$(jq -er '.n' <<<"$compare")" || run_all "unreadable compare"
          [ "$n" -gt 0 ] || run_all "empty file list"
          [ "$n" -lt 300 ] || run_all "300+ files changed"
          files="$(jq -er '.f[]' <<<"$compare")" || run_all "unreadable file list"
          is_doc() {
            case "$1" in
            # Markdown at the root and the listed files only (in a case pattern `*` also matches
            # `/`, so deeper Markdown is matched first and counts as code).
            sdk/README.md|.github/ISSUE_TEMPLATE/*.md|LICENSE) return 0 ;;
            */*.md) return 1 ;;
            *.md) return 0 ;;
            *) return 1 ;;
            esac
          }
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if is_doc "$f"; then echo "  docs: $f"; else echo "  code: $f"; code=true; fi
          done <<<"$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then echo "code changed: every job runs"; else echo "documentation only: build and test jobs skipped"; fi

  build:
    name: Lint, test & build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Formatting/style (rules in .editorconfig). Fix locally with ./gradlew ktlintFormat.
      - name: ktlint (:sdk)
        run: ./gradlew ktlintCheck --stacktrace

      # Public API baseline (sdk/api/sdk.api). Red = the surface changed and the baseline was
      # not regenerated; see CONTRIBUTING, "When the API check fails".
      - name: Public API check (:sdk)
        run: ./gradlew :sdk:apiCheck --stacktrace

      - name: Android lint (:sdk)
        run: ./gradlew lint --stacktrace

      - name: Unit tests (:sdk)
        run: ./gradlew test --stacktrace

      - name: Assemble :sdk (release)
        run: ./gradlew :sdk:assembleRelease --stacktrace

      - name: Upload lint & test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # The shared scenario manifest is vendored from adhub's @admoai/sdk-scenarios package
  # (admoai/adhub#4158): the bytes must be exactly the version MANIFEST_VERSION names, so a
  # scenario edited here instead of in adhub fails this repo's own PR. A newer published
  # version is a warning. The only CI step that reads the registry; the tests never do.
  scenarios:
    name: Scenario manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The check script's own tests
        run: .github/scripts/scenarios_test.sh
      - name: sdk/src/test/resources/e2e-scenarios.json is the published version it names
        run: .github/scripts/scenarios.sh check sdk/src/test/resources/e2e-scenarios.json
