# Runs on every PR and on pushes to main: ktlint + Android lint, unit tests, and
# a build of the :sdk library. Mirrors the JDK/Gradle
# setup used by release-please.yml so local, CI, and release builds stay aligned.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref supersedes in-flight runs, saving runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that changes only documentation skips the build and test jobs below.
  # They keep their names and report as skipped, which a ruleset reads as passing, so the
  # required checks never wait. The Scenario manifest job, push to main, workflow_dispatch
  # and the CodeQL / dependency scans are unfiltered. Fails open: a compare the API
  # refuses, or one at its 300-file cap, runs everything; so does a failed planner.
  changes:
    name: Plan the CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
      - name: Does the change touch anything but documentation?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: every job runs"; exit 0
          fi
          # A rename lists its old path too, so moving code into docs/ still runs the jobs.
          if ! compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" \
                 --jq '{n: (.files|length), f: [.files[] | .filename, (.previous_filename // empty)]}')"; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "::warning::compare API failed: every job runs"; exit 0
          fi
          if [ "$(jq '.n' <<<"$compare")" -ge 300 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "300+ files changed: every job runs"; exit 0
          fi
          is_doc() {
            case "$1" in
            docs/*|*.md|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*) return 0 ;;
            *) return 1 ;;
            esac
          }
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if is_doc "$f"; then echo "  docs: $f"; else echo "  code: $f"; code=true; fi
          done < <(jq -r '.f[]' <<<"$compare")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then echo "code changed: every job runs"; else echo "documentation only: build and test jobs skipped"; fi

  build:
    name: Lint, test & build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Formatting/style (rules in .editorconfig). Fix locally with ./gradlew ktlintFormat.
      - name: ktlint (:sdk)
        run: ./gradlew ktlintCheck --stacktrace

      # Public API baseline (sdk/api/sdk.api). Red = the surface changed and the baseline was
      # not regenerated; see CONTRIBUTING, "When the API check fails".
      - name: Public API check (:sdk)
        run: ./gradlew :sdk:apiCheck --stacktrace

      - name: Android lint (:sdk)
        run: ./gradlew lint --stacktrace

      - name: Unit tests (:sdk)
        run: ./gradlew test --stacktrace

      - name: Assemble :sdk (release)
        run: ./gradlew :sdk:assembleRelease --stacktrace

      - name: Upload lint & test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # The shared scenario manifest is vendored from adhub's @admoai/sdk-scenarios package
  # (admoai/adhub#4158): the bytes must be exactly the version MANIFEST_VERSION names, so a
  # scenario edited here instead of in adhub fails this repo's own PR. A newer published
  # version is a warning. The only CI step that reads the registry; the tests never do.
  scenarios:
    name: Scenario manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The check script's own tests
        run: .github/scripts/scenarios_test.sh
      - name: sdk/src/test/resources/e2e-scenarios.json is the published version it names
        run: .github/scripts/scenarios.sh check sdk/src/test/resources/e2e-scenarios.json
