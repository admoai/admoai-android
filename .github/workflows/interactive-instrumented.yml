# Runs the instrumented suite of the Lead Generation form view (SecureFormWebView) on an emulator.
# Not a required check: it only runs when the form's code, contract resources or tests change.
name: Interactive instrumented tests

on:
  pull_request:
    paths:
      - 'sdk/src/main/kotlin/com/admoai/sdk/interactive/**'
      - 'sdk/src/main/resources/com/admoai/sdk/interactive/**'
      - 'sdk/src/androidTest/**'
      - '.github/workflows/interactive-instrumented.yml'
  workflow_dispatch:

concurrency:
  group: interactive-instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: SecureFormWebView on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (com.admoai.sdk.interactive)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew :sdk:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.admoai.sdk.interactive --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
